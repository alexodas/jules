    "description": "A Lean 4/Mathlib formalization of a per-eigenvalue low-energy multiplicity bound for an infinite real Hilbert-space operator H = M_V + B, with potentially unbounded onsite multiplication and a bounded finite-color matching interaction plus perturbation. Under properness of the onsite potential, an explicit regular resolvent shift, a Neumann-series smallness hypothesis, and λ < R - ‖B‖ with λ unequal to the regular shift, the geometric multiplicity of λ is at most the number of tiles with onsite energy ≤ R. Comparator selects exactly this one theorem, not the lemmas used to prove it. The inequality is per eigenspace and does NOT bound the sum of multiplicities across distinct eigenvalues or imply an indexed min–max estimate, inverse-square spectral summability, an explicit aperiodic-tiling model, or any result about Riemann zeta zeros. Novelty is unknown; this is a targeted resubmission experiment after a mechanically successful earlier submission was rejected for misleading Mathlib provenance and insufficient research interest.",
