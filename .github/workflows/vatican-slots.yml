name: Temporary Vatican slots check
on:
  push:
    paths: ['.github/workflows/vatican-slots.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          python - <<'PY'
          import requests, collections
          base='https://tickets.museivaticani.va/api'; s=requests.Session()
          for n in range(1,5):
            p={'lang':'it','visitorNum':str(n),'visitDate':'20/08/2026','area':'1','who':'','page':'0','tag':'MV-Biglietti'}
            d=s.get(base+'/search/resultPerTag',params=p,timeout=30).json()
            prod=next((x for x in d.get('visits',[]) if x.get('name')=='Musei Vaticani - Visite Guidate Singoli Musei'),None)
            if not prod:
              print('PARTY',n,'NO_PRODUCT'); continue
            q={'lang':'it','visitLang':'ITA','visitTypeId':str(prod['id']),'visitorNum':str(n),'visitDate':'20/08/2026'}
            tt=s.get(base+'/visit/timeavail',params=q,timeout=30).json().get('timetable',[])
            grouped=collections.defaultdict(list)
            for x in tt: grouped[x['time']].append(x['availability'])
            print('PARTY',n,'PRODUCT_AVAIL',prod.get('availability'),'ID',prod['id'])
            for tm,sts in grouped.items():
              # An hour is usable if at least one parallel group isn't SOLD_OUT.
              print(' ',tm,'AVAILABLE' if any(x!='SOLD_OUT' for x in sts) else 'SOLD_OUT','DETAIL',','.join(sts))
          PY
