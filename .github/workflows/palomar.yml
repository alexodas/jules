name: Palomar preparation checks
on:
  push:
    branches: [main, "palomar/**"]
  pull_request:
  workflow_dispatch:

jobs:
  lean-and-comparator:
    # Ubuntu 24.04's AppArmor policy blocks Bubblewrap user-namespace setup.
    # Use Ubuntu 22.04 to run Comparator in its intended sandbox.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Ensure pinned Lean toolchain (retry transient downloads)
        run: |
          for attempt in 1 2 3 4 5; do
            if lake --version; then exit 0; fi
            echo "Lean download failed; retry $attempt/5"
            sleep $((5 * attempt))
          done
          exit 1
      - name: Static packaging checks
        run: python3 scripts/check-palomar-layout.py
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build proofs and statement modules
        run: lake build
      - name: Run Comparator (bundled kernels)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bash scripts/verify-comparator.sh
