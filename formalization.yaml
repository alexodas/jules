    "name": "Jules Spectral Geometry — canonical-product zero localization",
    "description": "The Jules Lean 4 project studies conditional spectral properties of geometric operators and a related family of regularized canonical products. This Palomar Comparator entry selects only the self-contained canonical-product strand: for explicitly paired quadratic factors, a compact-wise summable majorant gives uniform product convergence; all zeros of the constructed product lie on a prescribed affine real line in the complex plane. Summability of inverse-square positive levels suffices for admissibility, and each nonzero level produces a zero. The zero line is built into the factors and is not a statement about Riemann zeta. Connecting levels to a specific geometric operator's spectrum and proving required eigenvalue summability remain open. No historical novelty or Riemann hypothesis result is claimed.",
