name: Temporary Vatican cart verification
on:
  push:
    paths:
      - '.github/workflows/vatican-cart-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Playwright Python
        run: python -m pip install --quiet playwright
      - name: Verify 22 Aug 12:00 for two people
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          URL='https://tickets.museivaticani.va/home/calendar/visit/MV-Biglietti/1'
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome', headless=True)
              page=browser.new_page(locale='it-IT', timezone_id='Europe/Rome', viewport={'width':1440,'height':1200})
              page.goto(URL, wait_until='domcontentloaded', timeout=90000)
              page.wait_for_timeout(3000)

              # Select 22 August.
              day=page.locator('button[aria-label="22 agosto 2026"]')
              print('DAY_VISIBLE',day.is_visible(),'ENABLED',day.is_enabled())
              day.click()
              page.wait_for_timeout(300)

              # Actual form field for visitors.
              visitors=page.locator('#numberInput')
              print('VISITORS_VISIBLE',visitors.is_visible(),'ENABLED',visitors.is_enabled())
              visitors.fill('2')
              visitors.dispatch_event('input')
              visitors.dispatch_event('change')
              page.wait_for_timeout(300)
              print('VISITORS_VALUE',visitors.input_value())

              # Submit calendar form.
              confirm=page.locator('button[data-cy="submitCalendar"]')
              print('CONFIRM_ENABLED',confirm.is_enabled())
              confirm.click()
              try: page.wait_for_url(re.compile(r'/home/visit/'),timeout=30000)
              except: pass
              page.wait_for_timeout(4000)
              print('RESULT_URL',page.url)
              txt=page.locator('body').inner_text()
              print('RESULT_BODY',txt[:14000])

              # Locate standard admission card/product and its action.
              title=page.get_by_text("Musei Vaticani - Biglietti d'ingresso", exact=False)
              print('STANDARD_TITLE_COUNT',title.count())
              booked=False
              if title.count():
                  root=title.first
                  for level in range(8):
                      try:
                          parent=root.locator('xpath=..') if level else root
                          buttons=parent.locator('button,a')
                          for j in range(buttons.count()):
                              b=buttons.nth(j)
                              try:
                                  bt=' '.join(b.inner_text().split())
                                  if b.is_visible() and re.search(r'PRENOTA|BOOK',bt,re.I):
                                      print('STANDARD_ACTION',repr(bt),'enabled',b.is_enabled())
                                      if b.is_enabled(): b.click(); booked=True
                                      break
                              except: pass
                          if booked: break
                          root=parent
                      except: pass
              print('BOOK_CLICKED',booked)
              page.wait_for_timeout(3000)
              print('PRODUCT_URL',page.url)
              prod=page.locator('body').inner_text()
              print('PRODUCT_BODY',prod[:18000])

              # Dump candidate controls.
              for i in range(page.locator('input').count()):
                  e=page.locator('input').nth(i)
                  try:
                      if e.is_visible(): print('INPUT',i,e.get_attribute('id'),e.get_attribute('type'),e.get_attribute('readonly'),e.input_value(),e.evaluate('(x)=>x.outerHTML')[:900])
                  except: pass
              for i in range(page.locator('button').count()):
                  b=page.locator('button').nth(i)
                  try:
                      if b.is_visible(): print('BUTTON',i,repr(' '.join(b.inner_text().split())),b.is_enabled(),b.evaluate('(x)=>x.outerHTML')[:900])
                  except: pass

              # Select quantity 2 for full ticket using any control in its row.
              qty_ok=False
              labels=page.get_by_text('Biglietto Intero', exact=False)
              if labels.count():
                  root=labels.first
                  for level in range(7):
                      parent=root.locator('xpath=..') if level else root
                      # Try visible text inputs/selects in row first.
                      for sel in ['input','select','mat-select','button','[role="combobox"]']:
                          els=parent.locator(sel)
                          for j in range(els.count()):
                              e=els.nth(j)
                              try:
                                  if not (e.is_visible() and e.is_enabled()): continue
                                  tag=e.evaluate('(x)=>x.tagName.toLowerCase()')
                                  if tag=='input' and not e.get_attribute('readonly'):
                                      e.fill('2'); e.dispatch_event('change'); qty_ok=True; print('QTY_INPUT_SET'); break
                                  if tag=='select':
                                      e.select_option(label='2'); qty_ok=True; print('QTY_SELECT_SET'); break
                                  if tag in ('button','mat-select') or e.get_attribute('role')=='combobox':
                                      e.click(); page.wait_for_timeout(200)
                                      opts=page.get_by_text(re.compile(r'^\s*2\s*$'))
                                      for k in range(opts.count()):
                                          if opts.nth(k).is_visible(): opts.nth(k).click(); qty_ok=True; print('QTY_CUSTOM_SET'); break
                              except: pass
                              if qty_ok: break
                          if qty_ok: break
                      if qty_ok: break
                      root=parent
              print('QTY_OK',qty_ok)
              page.wait_for_timeout(500)

              # Select 12:00.
              time_ok=False
              times=page.get_by_text(re.compile(r'^\s*12:00\s*$'))
              print('TIME_COUNT',times.count())
              for i in range(times.count()):
                  t=times.nth(i)
                  try:
                      if t.is_visible():
                          print('TIME_HTML',t.evaluate('(x)=>x.outerHTML'))
                          t.click(); time_ok=True; break
                  except: pass
              print('TIME_OK',time_ok)
              page.wait_for_timeout(500)
              print('AFTER_SELECTIONS',page.locator('body').inner_text()[:18000])

              # Report enabled next-step buttons; do not advance to personal data/payment.
              for i in range(page.locator('button').count()):
                  b=page.locator('button').nth(i)
                  try:
                      bt=' '.join(b.inner_text().split())
                      if b.is_visible() and b.is_enabled() and re.search(r'continua|avanti|prosegui|conferma|aggiungi|continue|next',bt,re.I):
                          print('NEXT_ENABLED',i,repr(bt))
                  except: pass
              browser.close()
          PY
