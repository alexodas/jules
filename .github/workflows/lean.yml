name: Lean 4 / Mathlib proof check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean 4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Ensure pinned Lean toolchain (retry transient downloads)
        run: |
          for attempt in 1 2 3 4 5; do
            if lake --version; then exit 0; fi
            echo "Lean download failed; retry $attempt/5"
            sleep $((5 * attempt))
          done
          exit 1
      - name: Download pinned Mathlib cache
        run: lake exe cache get
      - name: Compile and kernel-check Lean proof
        run: lake build SpectralGeometry Challenge Solution ChallengeFinite SolutionFinite
