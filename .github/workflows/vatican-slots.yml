name: Temporary Vatican slots check
on:
  push:
    paths:
      - '.github/workflows/vatican-slots.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Check Vatican slots
        run: |
          cat > /tmp/check.py <<'PY'
          import re, json
          from playwright.sync_api import sync_playwright
          URL='https://tickets.museivaticani.va/home/calendar/visit/MV-Biglietti/1'
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(locale='it-IT', timezone_id='Europe/Rome', viewport={'width':1440,'height':1200})
              xhr=[]
              def onresp(r):
                  if r.request.resource_type in ('xhr','fetch'):
                      try:
                          ct=(r.headers.get('content-type') or '')
                          body=r.text() if ('json' in ct or 'text' in ct) else ''
                          xhr.append((r.status,r.url,body[:12000]))
                      except: xhr.append((r.status,r.url,''))
              page.on('response',onresp)
              page.goto(URL,wait_until='domcontentloaded',timeout=90000)
              page.wait_for_timeout(5000)
              day=page.get_by_role('button',name='20',exact=True)
              print('DAY20_COUNT',day.count(),'VISIBLE',day.first.is_visible(),'ENABLED',day.first.is_enabled())
              print('DAY20_HTML',day.first.evaluate('(e)=>e.outerHTML'))
              day.first.click()
              page.wait_for_timeout(1000)
              print('AFTER_DAY_URL',page.url)
              for i in range(page.locator('input').count()):
                  e=page.locator('input').nth(i)
                  print('INPUT',i,'visible',e.is_visible(),'enabled',e.is_enabled(),'value',e.input_value() if e.is_visible() else '',e.evaluate('(x)=>x.outerHTML'))
              # The visitor field is the last visible text input on this form.
              vis=[page.locator('input').nth(i) for i in range(page.locator('input').count()) if page.locator('input').nth(i).is_visible() and page.locator('input').nth(i).is_enabled()]
              print('VISIBLE_INPUTS',len(vis))
              visitor=vis[-1]
              visitor.fill('1')
              print('VISITOR_VALUE',visitor.input_value())
              page.get_by_role('button',name=re.compile('CONFERMA',re.I)).click()
              try: page.wait_for_load_state('domcontentloaded',timeout=15000)
              except: pass
              page.wait_for_timeout(6000)
              text=page.locator('body').inner_text()
              print('\n===== FINAL URL =====\n',page.url)
              print('\n===== FINAL BODY =====\n',text[:30000])
              times=sorted(set(re.findall(r'(?<!\\d)(?:[01]?\\d|2[0-3])[:.]\\d{2}(?!\\d)',text)))
              print('\nTIMES_FOUND',times)
              print('\n===== BUTTONS FINAL =====')
              for i in range(page.locator('button').count()):
                  e=page.locator('button').nth(i)
                  try:
                      if e.is_visible(): print(i,repr(' '.join(e.inner_text().split())),e.is_enabled(),e.evaluate('(x)=>x.outerHTML')[:1000])
                  except: pass
              print('\n===== XHR/FETCH =====')
              for status,url,body in xhr:
                  print('\nXHR',status,url)
                  if body: print(body)
              b.close()
          PY
          python /tmp/check.py
