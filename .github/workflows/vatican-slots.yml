name: Temporary Vatican slots check
on:
  push:
    paths: ['.github/workflows/vatican-slots.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          python - <<'PY'
          import re, requests
          html=requests.get('https://tickets.museivaticani.va/home/',timeout=30).text
          scripts=re.findall(r'src="([^"]+\.js[^"]*)"',html)
          for s in scripts:
              u='https://tickets.museivaticani.va/'+s.lstrip('/')
              t=requests.get(u,timeout=30).text
              print('BUNDLE',u,'LEN',len(t))
              pats=['/api/visit','visitTime','availableTime','availableHour','timeSlot','getTime','hours','orari','availability']
              seen=set()
              for pat in pats:
                  for m in re.finditer(re.escape(pat),t,re.I):
                      a=max(0,m.start()-700); b=min(len(t),m.end()+1200); sn=t[a:b]
                      if sn not in seen:
                          print('\n---',pat,'---\n',sn); seen.add(sn)
                      if len(seen)>60: break
                  if len(seen)>60: break
          PY
