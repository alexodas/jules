name: Temporary Vatican first availability scan
on:
  push:
    paths:
      - '.github/workflows/vatican-first-availability.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Scan official Vatican standard ticket availability
        run: |
          python - <<'PY'
          import requests, datetime, json
          s=requests.Session()
          base='https://tickets.museivaticani.va/api'
          start=datetime.date(2026,8,18)
          end=datetime.date(2026,9,30)
          found=[]
          d=start
          while d<=end:
              ds=d.strftime('%d/%m/%Y')
              # Find standard unguided admission product for 2 people on this date
              p={'lang':'it','visitorNum':'2','visitDate':ds,'area':'1','who':'','page':'0','tag':'MV-Biglietti'}
              r=s.get(base+'/search/resultPerTag',params=p,timeout=20)
              try: data=r.json()
              except Exception:
                  print('DATE',ds,'SEARCH_ERROR',r.status_code); d+=datetime.timedelta(days=1); continue
              prod=next((v for v in data.get('visits',[]) if v.get('name')=="Musei Vaticani - Biglietti d'ingresso"),None)
              if not prod:
                  print('DATE',ds,'NO_STANDARD_PRODUCT'); d+=datetime.timedelta(days=1); continue
              q={'lang':'it','visitLang':'','visitTypeId':str(prod['id']),'visitorNum':'2','visitDate':ds}
              tr=s.get(base+'/visit/timeavail',params=q,timeout=20)
              try: tt=tr.json().get('timetable',[])
              except Exception:
                  print('DATE',ds,'TIME_ERROR',tr.status_code); d+=datetime.timedelta(days=1); continue
              usable=[x for x in tt if x.get('availability') in ('AVAILABLE','LOW_AVAILABILITY')]
              print('DATE',ds,'PRODUCT',prod.get('availability'),'USABLE',json.dumps(usable,ensure_ascii=False))
              if usable:
                  found.append((ds, usable))
                  if len(found)>=5: break
              d+=datetime.timedelta(days=1)
          print('FIRST_DATES',json.dumps(found,ensure_ascii=False))
          PY
