name: ICON2I Salerno Milano VPD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'icon2i-trigger.txt'
      - '.github/workflows/icon2i-salerno-temp.yml'
      - 'scripts/icon2i_vpd_chart.py'

permissions:
  contents: write

jobs:
  fetch-and-chart:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install plotting dependency
        run: python -m pip install --disable-pip-version-check matplotlib

      - name: Fetch ICON-2I, normalize data and generate deterministic chart
        shell: bash
        run: |
          set -u
          RUN_DATE=$(date -u +%Y-%m-%d)
          RUN_ISO="${RUN_DATE}T00:00Z"
          RUN_ENCODED="${RUN_DATE}T00%3A00"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TRIGGER='${{ github.event_name }}'

          HOURLY='dew_point_2m,temperature_2m,relative_humidity_2m'
          SALERNO_URL="https://single-runs-api.open-meteo.com/v1/forecast?latitude=40.6824&longitude=14.7681&hourly=${HOURLY}&models=italia_meteo_arpae_icon_2i&timezone=Europe%2FRome&forecast_days=2&run=${RUN_ENCODED}"
          MILANO_URL="https://single-runs-api.open-meteo.com/v1/forecast?latitude=45.4642&longitude=9.1900&hourly=${HOURLY}&models=italia_meteo_arpae_icon_2i&timezone=Europe%2FRome&forecast_days=2&run=${RUN_ENCODED}"

          set +e
          SALERNO_HTTP=$(curl --show-error --silent --location --write-out '%{http_code}' "$SALERNO_URL" -o /tmp/icon2i-salerno-raw.json)
          SALERNO_CURL=$?
          MILANO_HTTP=$(curl --show-error --silent --location --write-out '%{http_code}' "$MILANO_URL" -o /tmp/icon2i-milano-raw.json)
          MILANO_CURL=$?
          set -e

          STATUS='unknown'
          READY=0
          rm -f icon2i-run-ready.txt

          if [ "$SALERNO_CURL" -ne 0 ] || [ "$MILANO_CURL" -ne 0 ]; then
            STATUS="curl_error_salerno_${SALERNO_CURL}_milano_${MILANO_CURL}"
          elif [ "$SALERNO_HTTP" != '200' ] || [ "$MILANO_HTTP" != '200' ]; then
            STATUS="http_salerno_${SALERNO_HTTP}_milano_${MILANO_HTTP}"
          else
            set +e
            python scripts/icon2i_vpd_chart.py \
              --salerno-raw /tmp/icon2i-salerno-raw.json \
              --milano-raw /tmp/icon2i-milano-raw.json \
              --salerno-json icon2i-salerno-result.json \
              --milano-json icon2i-milano-result.json \
              --run-iso "$RUN_ISO" \
              --output icon2i-vpd-salerno-milano.png \
              --summary icon2i-vpd-summary.txt
            CHART_EXIT=$?
            set -e

            if [ "$CHART_EXIT" -eq 0 ]; then
              STATUS='ready_chart_salerno_milano'
              READY=1
            elif [ "$CHART_EXIT" -eq 3 ]; then
              STATUS='http_200_insufficient_numeric_data_for_tomorrow'
            else
              STATUS="chart_error_${CHART_EXIT}"
            fi
          fi

          printf 'checked_utc=%s\ntrigger_event=%s\nrun=%s\nsalerno_http_code=%s\nsalerno_curl_exit=%s\nmilano_http_code=%s\nmilano_curl_exit=%s\nstatus=%s\n' \
            "$NOW" "$TRIGGER" "$RUN_ISO" "$SALERNO_HTTP" "$SALERNO_CURL" "$MILANO_HTTP" "$MILANO_CURL" "$STATUS" > icon2i-last-check.txt

          if [ "$READY" -eq 1 ]; then
            printf 'available_utc=%s\nrun=%s\ncities=Salerno,Milano\ngraph=icon2i-vpd-salerno-milano.png\n' "$NOW" "$RUN_ISO" > icon2i-run-ready.txt
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon2i-last-check.txt
          [ -f icon2i-salerno-result.json ] && git add icon2i-salerno-result.json
          [ -f icon2i-milano-result.json ] && git add icon2i-milano-result.json
          [ -f icon2i-vpd-summary.txt ] && git add icon2i-vpd-summary.txt
          [ -f icon2i-vpd-salerno-milano.png ] && git add icon2i-vpd-salerno-milano.png
          if [ -f icon2i-run-ready.txt ]; then
            git add icon2i-run-ready.txt
          else
            git add -u icon2i-run-ready.txt 2>/dev/null || true
          fi

          git commit -m "ICON-2I Salerno Milano: ${STATUS} [skip ci]" || exit 0
          git push origin HEAD:main
