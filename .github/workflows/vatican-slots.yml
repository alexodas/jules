name: Temporary Vatican slots check
on:
  push:
    paths:
      - '.github/workflows/vatican-slots.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Check Vatican slots
        run: |
          cat > /tmp/check.py <<'PY'
          import re, json, time
          from playwright.sync_api import sync_playwright

          URL='https://tickets.museivaticani.va/home/calendar/visit/MV-Biglietti/1'
          DATE_DAY='20'

          def dump_controls(page, label):
              print(f'\n===== {label} URL={page.url} =====')
              try:
                  print(page.locator('body').inner_text()[:14000])
              except Exception as e:
                  print('BODY ERR', e)
              print('\n-- INPUTS --')
              for i in range(page.locator('input').count()):
                  el=page.locator('input').nth(i)
                  try: print(i, el.get_attribute('type'), el.get_attribute('name'), el.get_attribute('placeholder'), el.get_attribute('aria-label'), el.is_visible(), el.is_enabled())
                  except: pass
              print('\n-- BUTTONS --')
              for i in range(min(page.locator('button').count(),100)):
                  el=page.locator('button').nth(i)
                  try:
                      txt=' '.join(el.inner_text().split())
                      print(i, repr(txt), el.is_visible(), el.is_enabled())
                  except: pass

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True, args=['--disable-dev-shm-usage'])
              context=browser.new_context(locale='it-IT', timezone_id='Europe/Rome', viewport={'width':1440,'height':1200})
              page=context.new_page()
              reqs=[]
              page.on('request', lambda r: reqs.append((r.method,r.url,r.resource_type)))
              page.on('console', lambda m: print('CONSOLE',m.type,m.text))
              resp=page.goto(URL, wait_until='domcontentloaded', timeout=90000)
              print('HTTP', resp.status if resp else None)
              page.wait_for_timeout(5000)
              dump_controls(page,'INITIAL')

              # Try cookie/consent buttons if any
              for pat in ['Accetta','ACCETTA','Accept','ACCEPT','Continua','CONTINUA']:
                  try:
                      loc=page.get_by_role('button', name=re.compile(pat,re.I))
                      if loc.count() and loc.first.is_visible():
                          print('CLICK CONSENT',pat); loc.first.click(); page.wait_for_timeout(1000); break
                  except: pass

              # Calendar should be August 2026. If not, click next-month until August appears.
              body=page.locator('body').inner_text()
              for _ in range(3):
                  if re.search(r'August|Agosto|AUG', body, re.I): break
                  # click a likely next arrow button
                  clicked=False
                  for i in range(page.locator('button').count()):
                      b=page.locator('button').nth(i)
                      try:
                          txt=' '.join(b.inner_text().split())
                          aria=b.get_attribute('aria-label') or ''
                          if b.is_visible() and b.is_enabled() and (re.search(r'next|succ|arrow_right',txt+' '+aria,re.I)):
                              print('NEXT MONTH via',i,repr(txt),repr(aria)); b.click(); page.wait_for_timeout(1200); clicked=True; break
                      except: pass
                  if not clicked: break
                  body=page.locator('body').inner_text()

              # Click day 20: choose a visible enabled element with exact text 20, preferring button.
              clicked=False
              for selector in ['button','td','div','span']:
                  loc=page.locator(selector).filter(has_text=re.compile(r'^\\s*20\\s*$'))
                  for i in range(loc.count()):
                      el=loc.nth(i)
                      try:
                          if el.is_visible() and el.is_enabled():
                              print('CLICK DAY',selector,i,el.evaluate('(e)=>e.outerHTML'))
                              el.click(timeout=5000)
                              page.wait_for_timeout(1200)
                              clicked=True
                              break
                      except Exception as e:
                          pass
                  if clicked: break
              print('DAY_CLICKED',clicked)
              dump_controls(page,'AFTER DAY')

              # Locate visitor input (prefer number, then visible input not language/search).
              candidates=[]
              for i in range(page.locator('input').count()):
                  el=page.locator('input').nth(i)
                  try:
                      if not (el.is_visible() and el.is_enabled()): continue
                      typ=(el.get_attribute('type') or '').lower()
                      name=(el.get_attribute('name') or '').lower()
                      ph=(el.get_attribute('placeholder') or '').lower()
                      aria=(el.get_attribute('aria-label') or '').lower()
                      score=0
                      if typ=='number': score+=10
                      if any(k in name+ph+aria for k in ['visit','visitor','visitat','persone','people','numero','number']): score+=7
                      if typ in ['text','number','tel','']: score+=1
                      candidates.append((score,i))
                  except: pass
              candidates.sort(reverse=True)
              print('INPUT CANDIDATES',candidates)

              if not candidates:
                  print('NO VISITOR INPUT FOUND')
              else:
                  idx=candidates[0][1]
                  for n in [1,2,3,4]:
                      print(f'\n######## VISITORS {n} ########')
                      # reload fresh each iteration except first to avoid navigation state issues
                      if n != 1:
                          page.goto(URL, wait_until='domcontentloaded', timeout=90000); page.wait_for_timeout(3500)
                          # day click again
                          for selector in ['button','td','div','span']:
                              loc=page.locator(selector).filter(has_text=re.compile(r'^\\s*20\\s*$'))
                              done=False
                              for j in range(loc.count()):
                                  e=loc.nth(j)
                                  try:
                                      if e.is_visible() and e.is_enabled(): e.click(timeout=5000); page.wait_for_timeout(700); done=True; break
                                  except: pass
                              if done: break
                          # recalc input
                          cc=[]
                          for j in range(page.locator('input').count()):
                              e=page.locator('input').nth(j)
                              try:
                                  if not (e.is_visible() and e.is_enabled()): continue
                                  typ=(e.get_attribute('type') or '').lower(); s=10 if typ=='number' else 1
                                  meta=' '.join([(e.get_attribute(x) or '') for x in ['name','placeholder','aria-label']]).lower()
                                  if any(k in meta for k in ['visit','visitor','visitat','persone','people','numero','number']): s+=7
                                  cc.append((s,j))
                              except: pass
                          cc.sort(reverse=True); idx=cc[0][1]
                      inp=page.locator('input').nth(idx)
                      try:
                          inp.fill(str(n)); page.wait_for_timeout(300)
                      except Exception as e:
                          print('FILL ERR',e)
                      # click confirm
                      confirmed=False
                      for pat in ['CONFERMA','Conferma','CONFIRM','Confirm']:
                          try:
                              loc=page.get_by_role('button', name=re.compile(pat,re.I))
                              if loc.count() and loc.first.is_visible() and loc.first.is_enabled():
                                  print('CLICK CONFIRM',pat); loc.first.click(); confirmed=True; break
                          except: pass
                      if not confirmed:
                          for j in range(page.locator('button').count()):
                              b=page.locator('button').nth(j)
                              try:
                                  if b.is_visible() and b.is_enabled() and re.search(r'conferma|confirm',b.inner_text(),re.I): b.click(); confirmed=True; break
                              except: pass
                      print('CONFIRMED',confirmed)
                      try: page.wait_for_load_state('domcontentloaded', timeout=15000)
                      except: pass
                      page.wait_for_timeout(4000)
                      dump_controls(page,f'RESULT {n}')
                      # Print likely times from visible text and buttons
                      txt=page.locator('body').inner_text()
                      times=sorted(set(re.findall(r'(?<!\\d)(?:[01]?\\d|2[0-3])[:.]\\d{2}(?!\\d)',txt)))
                      print('TIMES_FOUND',times)

              print('\n===== NETWORK CANDIDATES =====')
              for method,u,typ in reqs:
                  lu=u.lower()
                  if any(k in lu for k in ['api','avail','slot','time','calendar','visit','ticket','reservation']):
                      print(method,typ,u)
              browser.close()
          PY
          python /tmp/check.py
