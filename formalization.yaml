    "name": "Jules Spectral Geometry — canonical products and finite/infinite geometric operators",
    "description": "This Lean 4 formalization studies conditional spectral and energy properties of geometric operators alongside regularized paired canonical products. A single independent Comparator challenge selects 48 theorems and 14 definitions: prescribed-line zeros and locally uniform convergence of the constructed product; symmetry, positivity and eigenvalues for finite geometric matrices; natural domains, density, point eigenvalues and energy-growth summability for infinite diagonal multiplication on real ℓ²; finiteness of point eigenvalues below a cutoff under a finite-sublevel assumption; and nonnegative symmetric finite-edge interactions and bounded perturbations on an infinite tile set. These theorems retain their explicit assumptions. The finite-edge component does not assert spectral completeness for a general infinitely interacting operator. Canonical-product zero localization is a property of the chosen factors, not a result about Riemann zeta zeros, and no link between the product's prescribed levels and eigenvalues of a particular geometric operator is established. Novelty and scientific peer review are not claimed.",
