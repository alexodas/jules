name: Temporary Vatican slots check
on:
  push:
    paths: ['.github/workflows/vatican-slots.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect frontend API routes
        run: |
          set -e
          curl -fsSL 'https://tickets.museivaticani.va/home/' -o /tmp/index.html
          echo '=== JS FILES ==='
          grep -Eo 'src="[^"]+\.js[^"]*"' /tmp/index.html || true
          python - <<'PY'
          import re,requests
          base='https://tickets.museivaticani.va/home/'
          html=open('/tmp/index.html').read()
          scripts=re.findall(r'src="([^"]+\.js[^"]*)"',html)
          for s in scripts:
              u=s if s.startswith('http') else base+s.lstrip('/')
              try:
                  t=requests.get(u,timeout=30).text
              except Exception as e:
                  print('ERR',u,e); continue
              print('\n===',u,len(t),'===')
              for pat in [r'/api/visit[^"\'` ]*',r'visitTime',r'visit/time',r'availableTime',r'availableHour',r'timeSlot',r'hour']:
                  for m in list(re.finditer(pat,t,re.I))[:30]:
                      a=max(0,m.start()-500); b=min(len(t),m.end()+800)
                      print(t[a:b])
          PY
