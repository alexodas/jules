name: Temporary fast Vatican ticket check
on:
  push:
    paths:
      - '.github/workflows/vatican-fast-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import requests,re,json
          u='https://tickets.museivaticani.va/api/search/resultPerTag'
          p={'lang':'it','visitorNum':'1','visitDate':'20/08/2026','area':'1','who':'','page':'0','tag':'MV-Biglietti'}
          d=requests.get(u,params=p,timeout=30).json()
          print('TOTAL',d.get('totalResults'))
          for v in d.get('visits',[]):
              n=v.get('name','')
              guided=bool(re.search(r'Guidat|Guida|Didatt|Grupp',n,re.I))
              print(json.dumps({'id':v.get('id'),'name':n,'availability':v.get('availability'),'participants':v.get('numberParticipants'),'guided':guided,'description':v.get('description')},ensure_ascii=False))
          PY
