name: ICON2I Salerno Milano VPD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'icon2i-trigger.txt'
      - '.github/workflows/icon2i-salerno-temp.yml'
      - 'scripts/icon2i_vpd_chart.py'

permissions:
  contents: write

jobs:
  fetch-and-chart:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete every PNG and corresponding ZIP from GitHub before workflow work
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Remove ALL PNG files and ZIP archives that correspond to PNG outputs.
          # A ZIP is considered corresponding when it has the same basename as a PNG.
          find . -type f -iname '*.png' -print0 | while IFS= read -r -d '' png; do
            zip="${png%.*}.zip"
            rm -f "$zip"
            rm -f "$png"
          done
          find /tmp -maxdepth 3 -type f -iname '*.png' -print0 2>/dev/null | while IFS= read -r -d '' png; do
            zip="${png%.*}.zip"
            rm -f "$zip"
            rm -f "$png"
          done
          git add -u -- '*.png' '*.zip' 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m 'Remove stale PNGs and matching ZIPs before ICON-2I generation [skip ci]'
            git push origin HEAD:main
          fi

          # Defensive verification: no PNG, nor a same-basename ZIP for a PNG output,
          # may remain in the workflow workspace now.
          if find . -type f -iname '*.png' -print -quit | grep -q .; then
            echo 'ERROR: PNG still present after cleanup' >&2
            exit 20
          fi

      - name: Install plotting dependency
        run: python -m pip install --disable-pip-version-check matplotlib

      - name: Fetch latest available ICON-2I run and generate today's chart
        shell: bash
        run: |
          set -u
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TRIGGER='${{ github.event_name }}'
          TODAY_LOCAL=$(TZ=Europe/Rome date +%Y-%m-%d)
          TODAY_UTC=$(date -u +%Y-%m-%d)
          YESTERDAY_UTC=$(date -u -d 'yesterday' +%Y-%m-%d)
          UTC_HOUR=$(date -u +%H)
          HOURLY='dew_point_2m,temperature_2m,relative_humidity_2m'

          STATUS='no_available_run'
          READY=0
          SELECTED_RUN='none'

          rm -f icon2i-run-ready.txt icon2i-vpd-summary.txt icon2i-vpd-salerno-milano.zip
          rm -f /tmp/icon2i-vpd-summary.txt /tmp/icon2i-salerno-result.json /tmp/icon2i-milano-result.json /tmp/icon2i-vpd-salerno-milano.zip

          if [ "$UTC_HOUR" -ge 12 ]; then
            CANDIDATES=(
              "${TODAY_UTC}T12:00Z"
              "${TODAY_UTC}T00:00Z"
              "${YESTERDAY_UTC}T12:00Z"
              "${YESTERDAY_UTC}T00:00Z"
            )
          else
            CANDIDATES=(
              "${TODAY_UTC}T00:00Z"
              "${YESTERDAY_UTC}T12:00Z"
              "${YESTERDAY_UTC}T00:00Z"
            )
          fi

          for RUN_ISO in "${CANDIDATES[@]}"
          do
            find /tmp -maxdepth 3 -type f -iname '*.png' -print0 2>/dev/null | while IFS= read -r -d '' png; do
              rm -f "${png%.*}.zip" "$png"
            done
            find . -type f -iname '*.png' -print0 2>/dev/null | while IFS= read -r -d '' png; do
              rm -f "${png%.*}.zip" "$png"
            done
            rm -f /tmp/icon2i-vpd-summary.txt /tmp/icon2i-salerno-result.json /tmp/icon2i-milano-result.json /tmp/icon2i-vpd-salerno-milano.zip

            RUN_ENCODED=$(printf '%s' "$RUN_ISO" | sed 's/:/%3A/g; s/Z$//')
            SALERNO_URL="https://single-runs-api.open-meteo.com/v1/forecast?latitude=40.6824&longitude=14.7681&hourly=${HOURLY}&models=italia_meteo_arpae_icon_2i&timezone=Europe%2FRome&forecast_days=2&run=${RUN_ENCODED}"
            MILANO_URL="https://single-runs-api.open-meteo.com/v1/forecast?latitude=45.4642&longitude=9.1900&hourly=${HOURLY}&models=italia_meteo_arpae_icon_2i&timezone=Europe%2FRome&forecast_days=2&run=${RUN_ENCODED}"

            set +e
            SALERNO_HTTP=$(curl --show-error --silent --location --write-out '%{http_code}' "$SALERNO_URL" -o /tmp/icon2i-salerno-raw.json)
            SALERNO_CURL=$?
            MILANO_HTTP=$(curl --show-error --silent --location --write-out '%{http_code}' "$MILANO_URL" -o /tmp/icon2i-milano-raw.json)
            MILANO_CURL=$?
            set -e

            if [ "$SALERNO_CURL" -ne 0 ] || [ "$MILANO_CURL" -ne 0 ]; then
              continue
            fi
            if [ "$SALERNO_HTTP" != '200' ] || [ "$MILANO_HTTP" != '200' ]; then
              continue
            fi

            set +e
            python scripts/icon2i_vpd_chart.py \
              --salerno-raw /tmp/icon2i-salerno-raw.json \
              --milano-raw /tmp/icon2i-milano-raw.json \
              --salerno-json /tmp/icon2i-salerno-result.json \
              --milano-json /tmp/icon2i-milano-result.json \
              --run-iso "$RUN_ISO" \
              --forecast-date "$TODAY_LOCAL" \
              --output /tmp/icon2i-vpd-salerno-milano.png \
              --summary /tmp/icon2i-vpd-summary.txt
            CHART_EXIT=$?
            set -e

            if [ "$CHART_EXIT" -eq 0 ] && [ -s /tmp/icon2i-vpd-salerno-milano.png ]; then
              SELECTED_RUN="$RUN_ISO"
              READY=1
              STATUS='ready_chart_salerno_milano_today'
              cp /tmp/icon2i-salerno-result.json icon2i-salerno-result.json
              cp /tmp/icon2i-milano-result.json icon2i-milano-result.json
              cp /tmp/icon2i-vpd-salerno-milano.png icon2i-vpd-salerno-milano.png
              cp /tmp/icon2i-vpd-summary.txt icon2i-vpd-summary.txt

              # Post-process the freshly generated PNG into a ZIP archive so clients
              # that cannot fetch repository PNG blobs directly can retrieve the ZIP.
              (cd /tmp && zip -j -q icon2i-vpd-salerno-milano.zip icon2i-vpd-salerno-milano.png)
              if [ ! -s /tmp/icon2i-vpd-salerno-milano.zip ]; then
                echo 'ERROR: ZIP post-processing failed' >&2
                exit 21
              fi
              cp /tmp/icon2i-vpd-salerno-milano.zip icon2i-vpd-salerno-milano.zip
              break
            fi
          done

          printf 'checked_utc=%s\ntrigger_event=%s\nrun=%s\nforecast_date=%s\nstatus=%s\n' \
            "$NOW" "$TRIGGER" "$SELECTED_RUN" "$TODAY_LOCAL" "$STATUS" > icon2i-last-check.txt

          if [ "$READY" -eq 1 ]; then
            printf 'available_utc=%s\nrun=%s\nforecast_date=%s\ncities=Salerno,Milano\ngraph=icon2i-vpd-salerno-milano.png\narchive=icon2i-vpd-salerno-milano.zip\n' \
              "$NOW" "$SELECTED_RUN" "$TODAY_LOCAL" > icon2i-run-ready.txt
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon2i-last-check.txt
          [ -f icon2i-salerno-result.json ] && git add icon2i-salerno-result.json
          [ -f icon2i-milano-result.json ] && git add icon2i-milano-result.json
          [ -f icon2i-vpd-summary.txt ] && git add icon2i-vpd-summary.txt
          [ -f icon2i-vpd-salerno-milano.png ] && git add icon2i-vpd-salerno-milano.png
          [ -f icon2i-vpd-salerno-milano.zip ] && git add icon2i-vpd-salerno-milano.zip
          if [ -f icon2i-run-ready.txt ]; then
            git add icon2i-run-ready.txt
          else
            git add -u icon2i-run-ready.txt 2>/dev/null || true
          fi
          git add -u icon2i-vpd-summary.txt 2>/dev/null || true
          git add -u icon2i-vpd-salerno-milano.zip 2>/dev/null || true

          git commit -m "ICON-2I Salerno Milano today: ${STATUS} [skip ci]" || exit 0
          git push origin HEAD:main
