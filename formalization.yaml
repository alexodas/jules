    "description": "An independently Comparator-checked Lean 4 theorem on the geometric multiplicity of low-energy real eigenvalues of an infinite onsite-plus-bounded-interaction operator H = M_V + B on real ℓ²(Tile). Under finite onsite sublevel sets, a unit-gap regular resolvent shift a, a small resolvent correction, λ ≠ a and λ < R − ‖B‖, the full eigenspace at λ has dimension at most #{t : V(t) ≤ R}. This gives finite-coordinate detection of an entire interacting eigenspace, for arbitrary (possibly infinite) tile sets and bounded finite-color matching interactions, without requiring B to be symmetric. The specific statement was first identified in this formalization; a focused, non-exhaustive literature search did not locate the same inequality in this exact formulation, so originality is considered possible, not established. This result is an individual-eigenspace bound, not a bound on the total number of low-lying eigenvalues, an indexed min–max inequality, or an application to a concrete aperiodic tiling.",
