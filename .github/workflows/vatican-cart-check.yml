name: Temporary Vatican cart verification
on:
  push:
    paths:
      - '.github/workflows/vatican-cart-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Playwright Python
        run: python -m pip install --quiet playwright
      - name: Verify 22 Aug 12:00 for two people
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright

          URL='https://tickets.museivaticani.va/home/calendar/visit/MV-Biglietti/1'
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome', headless=True)
              page=browser.new_page(locale='it-IT', timezone_id='Europe/Rome', viewport={'width':1440,'height':1200})
              page.goto(URL, wait_until='domcontentloaded', timeout=90000)
              page.wait_for_timeout(3000)

              # Day 22
              for i in range(page.locator('button').count()):
                  b=page.locator('button').nth(i)
                  try:
                      if ' '.join(b.inner_text().split())=='22' and b.is_visible() and b.is_enabled():
                          b.click(); break
                  except: pass
              page.wait_for_timeout(500)

              # Visitor field is readonly; use the native input setter + input/change events so Angular receives value 2.
              inp=page.locator('input').first
              print('VISITOR_INPUT_BEFORE', inp.evaluate('(e)=>e.outerHTML'))
              inp.evaluate("""el => {
                const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;
                setter.call(el,'2');
                el.dispatchEvent(new Event('input',{bubbles:true}));
                el.dispatchEvent(new Event('change',{bubbles:true}));
              }""")
              page.wait_for_timeout(300)
              print('VISITOR_VALUE', inp.input_value())

              # Confirm search
              clicked=False
              for i in range(page.locator('button').count()):
                  b=page.locator('button').nth(i)
                  try:
                      txt=' '.join(b.inner_text().split())
                      if re.search(r'^CONFERMA$',txt,re.I) and b.is_visible() and b.is_enabled():
                          print('CLICK_CONFIRM',i); b.click(); clicked=True; break
                  except: pass
              print('CONFIRM_CLICKED',clicked)
              page.wait_for_timeout(5000)
              print('RESULT_URL',page.url)
              txt=page.locator('body').inner_text()
              print('RESULT_BODY',txt[:12000])

              # Standard ticket card: click its PRENOTA if enabled.
              title=page.get_by_text("Musei Vaticani - Biglietti d'ingresso", exact=False)
              print('STANDARD_TITLE_COUNT',title.count())
              book_clicked=False
              if title.count():
                  root=title.first.locator('xpath=..')
                  for level in range(7):
                      try:
                          buttons=root.locator('button')
                          for j in range(buttons.count()):
                              b=buttons.nth(j)
                              try:
                                  bt=' '.join(b.inner_text().split())
                                  if re.search(r'PRENOTA|BOOK',bt,re.I) and b.is_visible():
                                      print('BOOK_BUTTON',bt,'enabled',b.is_enabled())
                                      if b.is_enabled(): b.click(); book_clicked=True
                                      break
                              except: pass
                          if book_clicked: break
                      except: pass
                      root=root.locator('xpath=..')
              print('BOOK_CLICKED',book_clicked)
              page.wait_for_timeout(3500)
              print('PRODUCT_URL',page.url)
              prodtxt=page.locator('body').inner_text()
              print('PRODUCT_BODY',prodtxt[:16000])

              # Find visible text/controls for ticket quantities and 12:00.
              print('INPUTS')
              for i in range(page.locator('input').count()):
                  e=page.locator('input').nth(i)
                  try:
                      print(i,e.is_visible(),e.is_enabled(),e.get_attribute('type'),e.get_attribute('readonly'),e.get_attribute('aria-label'),e.input_value(),e.evaluate('(x)=>x.outerHTML')[:700])
                  except: pass
              print('BUTTONS')
              for i in range(page.locator('button').count()):
                  b=page.locator('button').nth(i)
                  try:
                      if b.is_visible(): print(i,repr(' '.join(b.inner_text().split())),b.is_enabled(),b.evaluate('(x)=>x.outerHTML')[:700])
                  except: pass

              # Try custom quantity selector near 'Biglietto Intero'.
              qty_ok=False
              labels=page.get_by_text('Biglietto Intero',exact=False)
              if labels.count():
                  root=labels.first.locator('xpath=..')
                  for _ in range(6):
                      ctrls=root.locator('button,[role=combobox],input,mat-select')
                      for j in range(ctrls.count()):
                          c=ctrls.nth(j)
                          try:
                              if c.is_visible() and c.is_enabled():
                                  html=c.evaluate('(x)=>x.outerHTML')
                                  if 'readonly' in html or 'select' in html.lower() or 'arrow' in html.lower() or 'increment' in html.lower() or 'add' in html.lower():
                                      c.click(); page.wait_for_timeout(250)
                                      opts=page.get_by_text(re.compile(r'^\\s*2\\s*$'))
                                      for k in range(opts.count()):
                                          try:
                                              if opts.nth(k).is_visible(): opts.nth(k).click(); qty_ok=True; break
                                          except: pass
                              if qty_ok: break
                          except: pass
                      if qty_ok: break
                      root=root.locator('xpath=..')
              print('QTY_OK',qty_ok)

              # Select 12:00 if visible/enabled.
              time_ok=False
              times=page.get_by_text(re.compile(r'^\\s*12:00\\s*$'))
              for i in range(times.count()):
                  t=times.nth(i)
                  try:
                      if t.is_visible():
                          print('TIME_HTML',t.evaluate('(x)=>x.outerHTML'))
                          t.click(); time_ok=True; break
                  except: pass
              print('TIME_OK',time_ok)
              page.wait_for_timeout(500)
              print('FINAL_BODY',page.locator('body').inner_text()[:16000])

              # Show enabled continuation buttons, but do not submit further.
              for i in range(page.locator('button').count()):
                  b=page.locator('button').nth(i)
                  try:
                      bt=' '.join(b.inner_text().split())
                      if b.is_visible() and b.is_enabled() and re.search(r'continua|avanti|prosegui|conferma|aggiungi|continue|next',bt,re.I):
                          print('NEXT_ENABLED',i,repr(bt))
                  except: pass
              browser.close()
          PY
