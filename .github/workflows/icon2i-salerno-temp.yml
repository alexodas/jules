name: ICON2I Salerno run availability

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Open-Meteo ICON-2I dew point
        shell: bash
        run: |
          set -euo pipefail
          URL='https://single-runs-api.open-meteo.com/v1/forecast?latitude=40.6824&longitude=14.7681&hourly=dew_point_2m&models=italia_meteo_arpae_icon_2i&timezone=Europe%2FRome&forecast_days=2&run=2026-08-18T00%3A00'
          HTTP_CODE=$(curl --show-error --silent --location --write-out '%{http_code}' "$URL" -o /tmp/icon2i.json)
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != '200' ]; then
            echo 'Run non ancora disponibile.'
            exit 0
          fi
          python - <<'PY'
          import json, sys
          p='/tmp/icon2i.json'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          vals=d.get('hourly',{}).get('dew_point_2m',[])
          ok=any(isinstance(v,(int,float)) and not isinstance(v,bool) for v in vals)
          if not ok:
              print('HTTP 200 ma dew_point_2m non contiene valori numerici.')
              sys.exit(2)
          with open('icon2i-salerno-result.json','w',encoding='utf-8') as f:
              json.dump(d,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print('Run disponibile: JSON valido salvato.')
          PY

      - name: Save result and stop polling
        if: success() && hashFiles('icon2i-salerno-result.json') != ''
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'available_utc=%s\nrun=2026-08-18T00:00Z\nvariable=dew_point_2m\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > icon2i-run-ready.txt
          git add icon2i-salerno-result.json icon2i-run-ready.txt
          git rm .github/workflows/icon2i-salerno-temp.yml
          git commit -m 'Save available ICON-2I Salerno run and stop polling [skip ci]'
          git push origin HEAD:main
