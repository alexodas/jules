    "description": "A Lean 4 formalization prepared for independent Comparator verification of one theorem about the geometric multiplicity of low-energy real eigenvalues for an infinite onsite-plus-bounded-interaction operator H = M_V + B on real ℓ²(Tile). Under finite onsite sublevel sets, a unit-gap regular resolvent shift a, a small resolvent correction, λ ≠ a and λ < R − ‖B‖, the full eigenspace at λ has dimension at most #{t : V(t) ≤ R}. The bounded correction may include infinite finite-color matching interactions and need not be symmetric. This is a per-eigenspace bound, not a total low-energy eigenvalue count, an indexed min–max theorem or a concrete aperiodic-tiling result.",
